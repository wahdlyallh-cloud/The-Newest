name: Build & Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Compute Version Numbers
        run: |
          VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))
          VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"
          echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_ENV
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build web bundle
        env:
          VITE_APP_VERSION_CODE: ${{ env.VERSION_CODE }}
          VITE_APP_VERSION_NAME: ${{ env.VERSION_NAME }}
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Signed Release APK
        env:
          APP_VERSION_CODE: ${{ env.VERSION_CODE }}
          APP_VERSION_NAME: ${{ env.VERSION_NAME }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease

      - name: Prepare APK File
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "Hayat-AI-v${VERSION_NAME}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hayat-AI-Android-APK
          path: Hayat-AI-v${{ env.VERSION_NAME }}.apk
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${VERSION_NAME}" "Hayat-AI-v${VERSION_NAME}.apk" \
            --title "حياة AI v${VERSION_NAME}" \
            --notes "إصدار أندرويد المستقل (أوفلاين) - versionCode:${VERSION_CODE}"
